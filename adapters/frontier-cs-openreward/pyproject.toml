[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier-cs-openreward"
version = "0.1.0"
description = "OpenReward environment frontend for Frontier-CS"
requires-python = ">=3.11"
dependencies = ["openreward>=0.1.43", "pydantic>=2", "PyYAML>=6", "aiohttp>=3.9", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
frontier-cs-openreward = "frontier_cs_openreward.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_cs_openreward"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
